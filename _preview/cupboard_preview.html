<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Cupboard figure · stage 1 preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <style>
    /* Page tokens copied from pages/arachnid.html, so the preview looks like the real site. */
    :root {
      --bg: #080812; --bg2: #0d0d1c; --bg3: #13132a; --panel: #1a1a2e; --panel2: #0f0f22;
      --border: rgba(99,102,241,0.15); --border2: rgba(99,102,241,0.07);
      --accent: #6366f1; --accent2: #c4b5fd; --amber: #f59e0b; --red: #ef4444; --green: #34d399;
      --text: #e2e8f0; --text-dim: #94a3b8; --text-bright: #f1f5f9;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 64px; }
    .kicker { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--accent2); margin: 0 0 8px; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; margin: 0 0 10px; color: var(--text-bright); }
    h1 em { color: var(--accent2); }
    .lede { color: var(--text-dim); max-width: 64ch; line-height: 1.6; margin: 0 0 28px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Preview · stage 3 · branch cupboard-figure</p>
    <h1>The <em>cupboard</em>, live</h1>
    <p class="lede">Stage 3: press "Simulate a day" in the side panel to play 24 hours of the controller's rules. Click an animal cube to zoom in. The dashed box has preview-only switches for the live mode. Not linked from the site.</p>

    <div data-cupboard-figure data-demo data-src="../assets/data/cupboard.json"></div>
  </main>
  <script src="../assets/js/cupboard-figure.js" defer></script>
</body>
</html>
