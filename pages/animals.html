<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Division V — Animals | SJFCROSS</title>
  <link rel="icon" type="image/png" href="../assets/img/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:          #0e1009;
      --panel:       #1e2818;
      --border:      #2e3d22;
      --accent:      #7ab648;
      --accent2:     #b8e05a;
      --text:        #d4cdb8;
      --text-dim:    #9aa086;
      --text-bright: #eee8d5;
      --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body:    'Lora', Georgia, serif;
      --font-mono:    'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body); font-size: 1rem; line-height: 1.7;
      min-height: 100vh; display: flex; flex-direction: column;
    }
    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(14,16,9,0.92);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 2rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    nav a {
      color: var(--text-dim); text-decoration: none;
      font-family: var(--font-mono); font-size: 0.8rem; letter-spacing: 0.05em;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--accent2); }
    nav .brand { color: var(--accent); font-weight: 500; font-size: 0.85rem; }
    nav .nav-links { display: flex; gap: 1.5rem; align-items: center; }

    .hero { padding: 4.5rem 2rem 3rem; text-align: center; }
    .hero-eyebrow {
      font-family: var(--font-mono); font-size: 0.72rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--accent); margin-bottom: 0.75rem;
    }
    .hero h1 {
      font-family: var(--font-display); font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700; color: var(--text-bright); line-height: 1.1;
    }

    main { flex: 1; width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 2rem 4rem; }
    .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
    .item { min-width: 0; }
    .card {
      position: relative; display: block; height: 340px;
      border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
      background: var(--panel); text-decoration: none;
      transition: transform 0.25s var(--ease-out), border-color 0.25s;
    }
    .card img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.4s var(--ease-out);
    }
    .card::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,12,6,0.95) 0%, rgba(10,12,6,0.4) 50%, transparent 100%);
    }
    .card-label { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4rem 1.5rem; z-index: 1; }
    .card-label h2 {
      font-family: var(--font-display); font-size: 1.5rem;
      color: var(--text-bright); line-height: 1.2; margin-bottom: 0.25rem;
    }
    .card-label p { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
    @media (hover: hover) and (pointer: fine) {
      .card:hover { transform: translateY(-5px); border-color: var(--accent); }
      .card:hover img { transform: scale(1.04); }
    }
    .card:active { transform: scale(0.98); transition-duration: 0.1s; }
    .how {
      display: inline-block; margin-top: 0.7rem;
      font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.04em;
      color: var(--accent); text-decoration: none;
    }
    .how:hover { color: var(--accent2); }

    footer {
      border-top: 1px solid var(--border); padding: 1.75rem 2rem; text-align: center;
      font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-dim);
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { color: var(--accent2); }

    @media (max-width: 680px) {
      nav { padding: 0.65rem 16px; }
      .hero { padding: 3rem 16px 2rem; }
      main { padding: 0 16px 3rem; }
      .cards { grid-template-columns: minmax(0, 1fr); }
      .card { height: 260px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card img { transition: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="../index.html" class="brand">SJFCROSS</a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="https://github.com/sjfcross" target="_blank" rel="noopener">GitHub</a>
    </div>
  </nav>

  <header class="hero">
    <p class="hero-eyebrow">Division V</p>
    <h1>Animals</h1>
  </header>

  <main>
    <div class="cards">
      <div class="item">
        <a href="cabinet.html" class="card">
          <img src="../assets/img/enclosure2.jpg" alt="The arachnid enclosure">
          <div class="card-label">
            <h2>Arachnid Cabinet</h2>
            <p>The tarantulas, their climate and the keeper's log.</p>
          </div>
        </a>
        <a href="arachnid.html" class="how">How it works →</a>
      </div>
      <div class="item">
        <a href="https://bird-nights.pages.dev" target="_blank" rel="noopener" class="card">
          <img src="../assets/img/s9warden/redwing_card.jpg" alt="Spectrogram of a Redwing call">
          <div class="card-label">
            <h2>Bird Recordings ↗</h2>
            <p>What an old phone at the window heard overnight.</p>
          </div>
        </a>
        <a href="s9warden.html" class="how">How it works →</a>
      </div>
    </div>
  </main>

  <footer>
    <a href="../index.html">← SJFCROSS Home</a>
  </footer>

</body>
</html>
